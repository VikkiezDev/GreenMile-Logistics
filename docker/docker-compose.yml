# version: '3.8'

services:
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: local_mssql
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - mssqldata:/var/opt/mssql/data

volumes:
  mssqldata: