version: '3.8'

services:
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: local_mssql
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassw0rd!
      - MSSQL_PID=Developer
    ports:
      # MS SQL default port is 1433
      - "1433:1433"
    volumes:
      # Persists your database MDF/LDF files
      - mssqldata:/var/opt/mssql/data

volumes:
  mssqldata: